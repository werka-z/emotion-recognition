name: aml
channels:
  - conda-forge
  - defaults
dependencies:
  # Python
  - python==3.10.20
  # pip-only packages
  - pip:
    - numpy==2.2.6
    - scipy==1.15.3
    - matplotlib==3.10.9
    - opencv-python==4.13.0.92
    - cvxopt==1.3.3          # QP solver used by BinaryKernelSVM (courselib)
    - pillow==12.2.0
    - contourpy==1.3.2
    - cycler==0.12.1
    - fonttools==4.63.0
    - kiwisolver==1.5.0
    - pyparsing==3.3.2
    - python-dateutil==2.9.0.post0
    - six==1.17.0

# Notes
# ─────
# Tested on MacBook with Apple M5 chip
# Also requires courselib (AppliedML repo) — not a pip package, see
# README.md for setup (COURSELIB_PATH).
#
# To recreate this environment:
#   conda env create -f environment_aml.yml
#   conda activate aml