name: fer_feature_extraction

channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python==3.12.12

  # conda-forge packages
  - numpy==1.26.4
  - dlib==19.24.2

  # pip-only packages
  - pip:
    - cmake==4.3.4
    - imutils==0.5.4
    - matplotlib==3.11.0
    - opencv-python==4.11.0.86
    - scipy==1.13.1

# Notes
# ─────
# Tested on MacBook with Apple M5 chip
#
# To recreate this environment:
#   conda env create -f environment.yml
#   conda activate fer_feature_extraction
